name: BeanPod
options:
  developmentLanguage: zh-Hans
  bundleIdPrefix: com.andyhu
  deploymentTarget:
    macOS: "26.0"
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  BeanKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    # 多语言：界面文字用 String Catalog（App/Localizable.xcstrings），中文是开发语言，英文是翻译
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  BeanPod:
    type: application
    platform: macOS
    sources: [App, Shared]
    dependencies:
      - package: BeanKit
      - target: beanpod-cli
        link: false
        embed: false
    postBuildScripts:
      # 命令行工具（MCP 服务）随 App 一起带上，放 Contents/Helpers；App 启动时装到 ~/.local/bin。
      # 不能放 Contents/MacOS：大小写不敏感的磁盘上 beanpod 和 BeanPod 会撞名。
      - name: Embed beanpod CLI
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          cp -f "$BUILT_PRODUCTS_DIR/beanpod" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/beanpod"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 豆仓
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleAllowMixedLocalizations: true
        LSApplicationCategoryType: public.app-category.productivity
        NSBluetoothAlwaysUsageDescription: 需要蓝牙来连接你的录音豆。
        NSMicrophoneUsageDescription: 录音豆没连上时，用这台 Mac 的麦克风录音。
        NSSpeechRecognitionUsageDescription: 需要语音识别来把录音转成文字，全部在本机完成。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andyhu.beanpod
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  beanpod-cli:
    type: tool
    platform: macOS
    sources: [Sources/beanpod]
    dependencies:
      - package: BeanKit
    settings:
      base:
        PRODUCT_NAME: beanpod
        PRODUCT_BUNDLE_IDENTIFIER: com.andyhu.beanpod.cli
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
  BeanPodMobile:
    type: application
    platform: iOS
    sources: [Shared, Mobile]
    dependencies:
      - package: BeanKit
    info:
      path: Mobile/Info.plist
      properties:
        CFBundleDisplayName: 豆仓
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleAllowMixedLocalizations: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [bluetooth-central, audio]
        NSBluetoothAlwaysUsageDescription: 需要蓝牙来连接你的录音豆。
        NSMicrophoneUsageDescription: 录音豆没连上时，用这台 iPhone 的麦克风录音。
        NSSpeechRecognitionUsageDescription: 没有配置云端转写时，用系统的语音识别把录音转成文字。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andyhu.beanpod.mobile
        PRODUCT_NAME: BeanPod
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
